name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 結合テストとE2Eが使うローカル専用のPostgreSQL・Azurite(devcontainerと同じimage)。
    # 認証情報はCI内だけで使う使い捨ての値で、Azuriteのキーは公開されている既定値。
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: siryou_mite
          POSTGRES_PASSWORD: local-development-password
          POSTGRES_DB: siryou_mite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siryou_mite -d siryou_mite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.36.0
        ports:
          - 10000:10000
          - 10001:10001

    # 単体・結合テストはsetupファイルで、E2Eはplaywright.config.tsで残りの環境変数を
    # 設定するため、ここではservice containerへの接続先だけを渡す。
    env:
      DATABASE_URL: postgresql://siryou_mite:local-development-password@localhost:5432/siryou_mite
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://localhost:10000/devstoreaccount1;QueueEndpoint=http://localhost:10001/devstoreaccount1;"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install
        run: npm ci --include=dev

      - name: Verify (typecheck, unit tests, build)
        run: npm run verify

      # 結合テスト(preview-capture)もChromiumを起動するため、結合テストより前に入れる
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Integration tests
        run: npm run test:integration

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage/
            playwright-report/
          retention-days: 14
