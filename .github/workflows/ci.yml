name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 結合テストとE2Eが使うローカル専用のPostgreSQL・Azurite(devcontainerと同じimage)。
    # 認証情報はCI内だけで使う使い捨ての値で、Azuriteのキーは公開されている既定値。
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: siryou_mite
          POSTGRES_PASSWORD: local-development-password
          POSTGRES_DB: siryou_mite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siryou_mite -d siryou_mite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.36.0
        ports:
          - 10000:10000
          - 10001:10001

    # 単体・結合テストはsetupファイルで、E2Eはplaywright.config.tsで残りの環境変数を
    # 設定するため、ここではservice containerへの接続先だけを渡す。
    env:
      DATABASE_URL: postgresql://siryou_mite:local-development-password@localhost:5432/siryou_mite
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://localhost:10000/devstoreaccount1;QueueEndpoint=http://localhost:10001/devstoreaccount1;"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install
        run: npm ci --include=dev

      - name: Verify (typecheck, unit tests, build)
        run: npm run verify

      # 結合テスト(preview-capture)もChromiumを起動するため、結合テストより前に入れる
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # Ubuntu 23.10+ のrunnerはAppArmorで非特権user namespaceを制限しており、
      # Chromium sandboxが起動できない。Preview Jobは sandbox 有効(設計 §7.5)を
      # テストで確認するため、sandboxを無効にせずrunner側の制限を外す
      - name: Allow unprivileged user namespaces for Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Integration tests
        run: npm run test:integration

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            coverage/
            playwright-report/
          retention-days: 14

  # Bicepの構文・型・lintの検証(設計 §19.3「PRではBicep validation」)。Azureへは接続しない。
  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bicep CLI
        run: az bicep install

      - name: Build and lint
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep

      # parameter fileは実値を環境変数から読むため、検証用のダミー値を渡す(秘密値ではない)。
      - name: Build staging parameters
        env:
          SIRYOU_TENANT_ID: 00000000-0000-0000-0000-000000000000
          SIRYOU_ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000001
          SIRYOU_ALLOWED_IP_RANGES: 203.0.113.10/32
          SIRYOU_ALERT_EMAIL: ops@example.com
          SIRYOU_GRANT_KEY_ID: ci-dummy
          SIRYOU_GRANT_PRIVATE_KEY: ci-dummy
          SIRYOU_GRANT_VERIFICATION_KEYS: "[]"
          SIRYOU_LOG_HMAC_KEY: ci-dummy
        run: az bicep build-params --file infra/parameters/staging.bicepparam --stdout > /dev/null
